# Prefer this file when Netlify Base directory = frontend.
# Standalone output is disabled on Netlify via next.config.ts (NETLIFY env).

[build]
  command = "yarn build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22.23.1"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/_next/static/chunks/*"
  [headers.values]
    Content-Type = "application/javascript"

[[headers]]
  for = "/_next/static/css/*"
  [headers.values]
    Content-Type = "text/css"

[[headers]]
  for = "/demos/*"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=86400"
