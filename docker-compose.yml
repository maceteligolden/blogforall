# Development stack — run alongside prod without clashing:
#   docker compose up -d
#   docker compose -f docker-compose.prod.yml up -d
#
# Isolated via compose project name `bloggr-dev`, host ports 5005 / 27017.
# Valkey is not published to the host. Service key stays `valkey` (Dokploy).
# Isolation from prod: container bloggr-valkey-dev, network bloggr-dev-network.

name: bloggr-dev

services:
  mongodb:
    image: mongo:7
    container_name: bloggr-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - bloggr-dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16
    container_name: bloggr-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blogforall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blogforall}
      POSTGRES_DB: ${POSTGRES_DB:-blogforall}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - bloggr-dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blogforall} -d ${POSTGRES_DB:-blogforall}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  valkey:
    image: valkey/valkey:8-alpine
    container_name: bloggr-valkey-dev
    volumes:
      - valkey-data-dev:/data
    networks:
      - bloggr-dev-network
    restart: unless-stopped
    command: ["--save", "60", "1000"]
    # No `ports:` — 6379 stays on the compose network only.
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: bloggr-backend
    ports:
      - "5005:5005"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: "5005"
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/blogforall}
      DATABASE_URL: ${DATABASE_URL:-postgres://blogforall:blogforall@postgres:5432/blogforall}
      # Pinned to the compose service. Do not interpolate ${REDIS_URL} — that can
      # silently point the app at a public Redis instead of this stack's Valkey.
      REDIS_URL: redis://bloggr-valkey-dev:6379
      ACCESS_SECRET: ${ACCESS_SECRET}
      REFRESH_SECRET: ${REFRESH_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:5005}
      UPLOAD_DIR: ${UPLOAD_DIR:-./uploads}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-5242880}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      BLOG_AI_OPENAI_API_KEY: ${BLOG_AI_OPENAI_API_KEY:-}
      BLOG_AI_CHAT_MODEL: ${BLOG_AI_CHAT_MODEL:-gpt-4o-mini}
      BLOG_AI_REVIEW_MODEL: ${BLOG_AI_REVIEW_MODEL:-gpt-4o-mini}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-noreply@bloggr.com}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-Bloggr}
      BREVO_WAITLIST_LIST_ID: ${BREVO_WAITLIST_LIST_ID:-}
      BETA_APPROVAL_NOTIFY_EMAIL: ${BETA_APPROVAL_NOTIFY_EMAIL:-macteligolden@gmail.com}
      NOTIFICATION_RETENTION_DAYS_READ: ${NOTIFICATION_RETENTION_DAYS_READ:-90}
      EMAIL_METADATA_RETENTION_DAYS: ${EMAIL_METADATA_RETENTION_DAYS:-365}
      EMAIL_QUEUE_NAME: ${EMAIL_QUEUE_NAME:-notification:email}
      WORKSPACE_DEFAULT_NAME: ${WORKSPACE_DEFAULT_NAME:-My Workspace}
      INVITATION_EXPIRY_DAYS: ${INVITATION_EXPIRY_DAYS:-7}
      WORKSPACE_API_KEY_ENCRYPTION_KEY: ${WORKSPACE_API_KEY_ENCRYPTION_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
      SENTRY_ENABLED: ${SENTRY_ENABLED:-}
      POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://us.i.posthog.com}
      POSTHOG_ENVIRONMENT: ${POSTHOG_ENVIRONMENT:-}
      POSTHOG_ENABLED: ${POSTHOG_ENABLED:-}
      ADMIN_SEED_ON_START: ${ADMIN_SEED_ON_START:-false}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-}
      ADMIN_SEED_FIRST_NAME: ${ADMIN_SEED_FIRST_NAME:-}
      ADMIN_SEED_LAST_NAME: ${ADMIN_SEED_LAST_NAME:-}
      ADMIN_SEED_ROLE: ${ADMIN_SEED_ROLE:-}
      GOOGLE_DRIVE_CLIENT_ID: ${GOOGLE_DRIVE_CLIENT_ID:-}
      GOOGLE_DRIVE_CLIENT_SECRET: ${GOOGLE_DRIVE_CLIENT_SECRET:-}
      GOOGLE_DRIVE_REDIRECT_URI: ${GOOGLE_DRIVE_REDIRECT_URI:-}
    volumes:
      - ./backend:/app
      - /app/node_modules
      - backend-uploads:/app/uploads
    networks:
      - bloggr-dev-network
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mongodb-data:
    driver: local
  postgres-data:
    driver: local
  valkey-data-dev:
    driver: local
  backend-uploads:
    driver: local

networks:
  bloggr-dev-network:
    name: bloggr-dev-network
    driver: bridge
